<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <title>Login - Bootstrap Admin Template</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link
      href="./assets/vendor/bootstrap.min.css"
      rel="stylesheet"
      type="text/css"
    />


    <link href="./assets/vendor/fontawesome/css/all.min.css" rel="stylesheet" />
        <link href="./assets/vendor/google-fonts.css?v=font-v44-local-1" rel="stylesheet" />

    <link href="./assets/css/style.css?v=20261027-style-20" rel="stylesheet" type="text/css" />
    <link href="./assets/css/signin.css?v=20261027-signin-5" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="navbar navbar-expand-lg navbar-dark admin-navbar">
      <div class="navbar-inner admin-navbar-inner">
        <div class="container">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-collapse" aria-controls="navbar-collapse" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>

          <a class="navbar-brand" href="./index.html"> Bootstrap Admin Template </a>

          <div class="collapse navbar-collapse" id="navbar-collapse">
            <ul class="navbar-nav ms-auto">
              <li>
                <a href="./signup.html"> Don't have an account? </a>
              </li>

              <li>
                <a href="./index.html">
                  <i class="fa-solid fa-chevron-left"></i>
                  Back to Homepage
                </a>
              </li>
            </ul>
          </div>
          <!--/.nav-collapse -->
        </div>
        <!-- /container -->
      </div>
      <!-- /navbar-inner -->
    </div>
    <!-- /navbar -->

    <main class="account-container" id="main-content" tabindex="-1">
      <div class="content clearfix">
        <form action="#" method="post">
          <h1>Member Login</h1>

          <div class="login-fields">
            <p>Please provide your details</p>

            <div class="field">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                value=""
                placeholder="Username"
                required
                 class="login username-field" />
            </div>
            <!-- /field -->

            <div class="field">
              <label for="password">Password:</label>
              <div class="password-field-wrapper">
                <input
                  type="password"
                  id="password"
                  name="password"
                  autocomplete="current-password"
                  value=""
                  placeholder="Password"
                  required
                  class="login password-field" />
                <button type="button" class="password-toggle" aria-controls="password" aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
              </div>
            </div>
            <!-- /password -->
          </div>
          <!-- /login-fields -->

          <div class="login-actions">
            <span class="login-checkbox">
              <input
                id="Field"
                name="Field"
                type="checkbox"
                class="field login-checkbox"
                value="First Choice"
                tabindex="4"
              />
              <label class="choice" for="Field">Keep me signed in</label>
            </span>

            <button type="submit" class="button btn btn-primary btn-lg">Sign In</button>
          </div>
          <!-- .actions -->

        </form>
      </div>
      <!-- /content -->
    </main>
    <!-- /account-container -->

    <div class="login-extra">
      <a href="./login.html#">Reset Password</a>
    </div>
    <!-- /login-extra -->






    <script src="./assets/vendor/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/base.js?v=20261027-base-3"></script>
    <script src="./assets/js/signin.js"></script>
  </body>
</html>
